# Step 4b: train the state reader (models/train_reader.py). Runs on a Kaggle GPU from the stored dataset.
# Reader v2: identical to v1 (configs/reader.yaml) except n_frames 3 (DECISIONS 2026-11-19): velocities hurt the brains most.
data_dir: outputs/dataset        # override with --data-dir on Kaggle (/kaggle/input/...)
out_dir: outputs/reader_v2
seed: 0
n_frames: 3                      # frames t-2, t-1, t stacked (9 input channels)
std_floor: 0.01                  # goal never moves (std ~0) and can height barely does: don't divide by ~0

batch_size: 256
lr: 0.001
epochs: 20
patience: 5                      # early stopping on validation loss
num_workers: 2                   # data-loading processes (use 0 on Windows)

wandb:
  project: robot-world-model
  mode: online                   # online | offline | disabled (falls back to offline if no WANDB_API_KEY)
