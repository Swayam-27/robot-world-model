# Step 5, world model v1 (DIAMOND-style pixel diffusion with EDM). Record changes in docs/DECISIONS.md.
# Data check (laptop):  python -m models.world_model_data --config configs/world_model_v1.yaml --limit 3
name: world_model_v1
seed: 0

data:
  data_dir: outputs/dataset                  # Step 3 episodes (Kaggle: --data-dir /kaggle/input/...)
  extra_data_dirs: [outputs/dataset_dagger]  # DAgger episodes: real physics too, more varied arm poses
  context_frames: 4                          # = CONTEXT_FRAMES in envs/constants.py (asserted)

model:
  type: diamond_unet
  channels: [64, 64, 64, 64]
  action_dim: 7
  action_history: 4        # last 4 actions -> MLP -> conditioning vector

training:
  batch_size: 64
  lr: 1.0e-4
  optimizer: adamw
  mixed_precision: true
  noise_augmentation_max: 0.7   # GameNGen setting; set 0.0 for the ablation
  checkpoint_every_minutes: 30
  log_samples_every_steps: 2000

sampling:
  denoising_steps: 3       # DIAMOND's setting; compare 3-5 later

logging:
  backend: wandb
  project: robot-world-model
