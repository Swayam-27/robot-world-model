# Step 6: replay validation episodes inside world model v1's dream (eval/dream.py).
# Run:  python -m eval.dream --config configs/dream_v1.yaml [--limit 8]
checkpoint: outputs/world_model_v1/best.pt
data_dirs: [outputs/dataset, outputs/dataset_dagger]   # VALIDATION episodes only
n_episodes: 100          # picked with a fixed seed from all validation episodes
real_start_frames: 1     # real frames given before dreaming starts: 1 = straight after reset, as in Step 7 (guide: 4)
denoising_steps: 3       # as trained/evaluated in Step 5
aug_level: 0.0           # context-noise level the model is TOLD at dream time (trained on 0-0.7)
seed: 0
batch: 50
out_dir: outputs/dream_v1             # per-step CSV, chart, GIFs (copied to results/ when final)
gif_episodes: 4
reader: outputs/reader_v4/reader_best.pt   # reader v4, for eval/dream_tracking.py
