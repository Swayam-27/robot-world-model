# Step 6: replay 100 validation episodes inside world model v1's dream.
# Run:  python -m eval.dream --config configs/dream_v1.yaml [--limit 8], then python -m eval.dream_tracking (same --config)
world_model: world_model_v1          # checked against the checkpoint's own name
checkpoint: outputs/world_model_v1/best.pt
data_dirs: [outputs/dataset, outputs/dataset_dagger]   # VALIDATION episodes only
n_episodes: 100          # round-robin over the 8 recorded brains, fixed seed
real_start_frames: 1     # real frames given before dreaming starts: 1 = straight after reset, as in Step 7 (guide: 4)
denoising_steps: 3       # as trained/evaluated in Step 5
aug_level: 0.0           # context-noise level the model is TOLD at dream time (v1 trained on 0-0.7)
swap_actions: true       # also dream every start with another brain's actions (for eval/action_test.py)
seed: 0
batch: 50
out_dir: outputs/dream_v1
gif_episodes: 8          # one per brain
reader: outputs/reader_v4/reader_best.pt   # for eval/dream_tracking.py
can_bright: 170          # a pixel this bright in R, G and B is the can (calibrated on real validation frames)
