# Step 2a, run 2: same as sac_pusher.yaml, only total_timesteps changed (300k -> 1M).
# Why: the 300k run was still improving at the end (checkpoint_measure: 0.258 m -> 0.115 m). See DECISIONS.md 2026-11-05.
# Run:  python -m policies.train_sac --config configs/sac_pusher_1m.yaml   (about 5 hours on Kaggle CPU)
name: sac_pusher_1m
seed: 0                      # SAC's own randomness + which train seeds the resets draw
total_timesteps: 1_000_000   # 10,000 episodes of 100 steps  <- the ONE change vs sac_pusher.yaml
checkpoint_every: 20_000     # -> 50 checkpoints, the skill ladder for the policy pool
out_dir: outputs/sac_pusher_1m

sac:                         # Stable-Baselines3 defaults, written out so they are visible
  learning_rate: 3.0e-4
  buffer_size: 1_000_000     # replay buffer: every step of training still fits (1M)
  batch_size: 256            # past steps sampled per update
  gamma: 0.99                # how much future reward counts
  tau: 0.005                 # how fast the target critics follow the critics
  learning_starts: 1_000     # random steps before learning begins
  device: cpu                # small MLPs + CPU simulator: a GPU would not speed this up
